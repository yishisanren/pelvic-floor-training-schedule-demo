<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megg 1 设备主页</title>
  <style>
    :root {
      --bg-top: #fce5ea;
      --bg-bottom: #f7f1f3;
      --card: rgba(255, 255, 255, 0.92);
      --line: rgba(108, 94, 100, 0.08);
      --text: #4f474b;
      --text-soft: #a59ca0;
      --text-faint: #b8b0b4;
      --pink: #ee8b98;
      --pink-deep: #8d555f;
      --pink-soft: #fdf0f2;
      --pink-soft-2: #fff5f6;
      --blue: #93bfcc;
      --blue-deep: #6fa8b8;
      --blue-soft: #eef7fa;
      --rose-soft: #f8eef0;
      --shadow: 0 18px 40px rgba(129, 107, 114, 0.08);
      --radius-xl: 30px;
      --radius-lg: 26px;
      --radius-md: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 195, 208, 0.38), transparent 34%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: inherit;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    button,
    a {
      font: inherit;
    }

    .phone-shell {
      width: 100%;
      max-width: 430px;
      padding: 14px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
      box-shadow: 0 30px 72px rgba(112, 94, 102, 0.12);
      backdrop-filter: blur(18px);
    }

    .app {
      min-height: calc(100vh - 48px);
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -4%, rgba(255, 223, 230, 0.75), transparent 28%),
        linear-gradient(180deg, #fcf8f9 0%, #f8f1f3 100%);
      border: 1px solid rgba(255,255,255,0.76);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.72);
    }

    .icon {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 14px;
      background: rgba(255,255,255,0.35);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-button {
      width: 34px;
      height: 34px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      color: #60595d;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .nav-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .content {
      padding: 10px 20px 34px;
    }

    .device-zone {
      padding: 8px 0 4px;
    }

    .device-product {
      display: block;
      width: min(100%, 320px);
      height: auto;
      margin: 0 auto;
    }

    .device-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      color: #8c8589;
      font-size: 15px;
      font-weight: 700;
    }

    .status-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      line-height: 1;
    }

    .status-divider {
      width: 1px;
      height: 14px;
      background: rgba(116, 101, 107, 0.16);
    }

    .device-status .icon {
      width: 20px;
      height: 20px;
      color: currentColor;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .battery-icon {
      width: 21px;
      height: 21px;
      color: currentColor;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section {
      margin-top: 22px;
    }

    .section-label {
      margin: 0 0 12px 6px;
      color: var(--text-faint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      margin: 0;
      color: var(--pink);
      font-size: 13px;
      font-weight: 700;
    }

    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(108, 94, 100, 0.08);
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      color: #9b9397;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(129, 107, 114, 0.05);
      text-decoration: none;
    }

    .plan-card {
      padding: 20px 20px 12px;
    }

    .plan-title {
      margin: 12px 0 0;
      font-size: 82px;
      line-height: 0.92;
      letter-spacing: -0.08em;
      font-weight: 700;
    }

    .plan-list {
      display: grid;
      margin-top: 10px;
    }

    .plan-item {
      width: 100%;
      border: 0;
      border-top: 1px solid rgba(108, 94, 100, 0.08);
      padding: 14px 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icon-badge.tone-blue {
      background: var(--blue-soft);
      color: var(--blue-deep);
    }

    .icon-badge.tone-pink {
      background: var(--pink-soft);
      color: var(--pink);
    }

    .icon-badge.tone-rose {
      background: var(--rose-soft);
      color: #b19ea3;
    }

    .plan-copy {
      flex: 1;
      min-width: 0;
    }

    .plan-copy strong {
      display: block;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .plan-copy span {
      display: block;
      margin-top: 5px;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .plan-tail {
      color: var(--text-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-width: 28px;
    }

    .chevron {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mode-list {
      display: grid;
      gap: 14px;
    }

    .mode-item {
      width: 100%;
      padding: 18px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--card);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      cursor: pointer;
    }

    .mode-copy {
      flex: 1;
      min-width: 0;
    }

    .mode-copy strong {
      display: block;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .mode-copy span {
      display: block;
      margin-top: 5px;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 600;
    }

    .game-card {
      overflow: hidden;
      padding: 0;
      background: linear-gradient(135deg, #ffe1e7 0%, #fdf2f4 100%);
    }

    .game-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 138px;
      align-items: center;
      gap: 16px;
      padding: 28px 28px 30px;
      min-height: 180px;
    }

    .game-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }

    .game-copy h3 {
      margin: 0;
      max-width: none;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: -0.04em;
      color: var(--pink-deep);
      white-space: nowrap;
    }

    .game-button {
      border: 0;
      padding: 13px 30px;
      border-radius: 999px;
      background: #8d525d;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(141, 82, 93, 0.18);
    }

    .game-art {
      width: 128px;
      height: 100px;
      justify-self: end;
      align-self: center;
    }

    .metrics-stack {
      display: grid;
      gap: 16px;
    }

    .metric-card {
      padding: 22px 20px 20px;
    }

    .metric-card .card-header {
      justify-content: flex-start;
    }

    .metric-title-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .metric-title-row.vertical {
      gap: 12px;
    }

    .metric-title-row strong {
      display: block;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .metric-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin-top: 18px;
    }

    .chart {
      display: block;
      width: 100%;
      height: auto;
    }

    .assessment-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 118px;
      gap: 14px;
      align-items: center;
      padding: 22px 20px;
    }

    .assessment-card h3 {
      margin: 0;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .assessment-card p {
      margin: 10px 0 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 600;
    }

    .assessment-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      color: var(--pink);
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .assessment-art {
      width: 118px;
      height: 118px;
      border-radius: 30px;
      background: linear-gradient(180deg, #fffafc 0%, #fff2f5 100%);
      border: 1px solid rgba(108, 94, 100, 0.06);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .assessment-art svg {
      width: 86px;
      height: 86px;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
      }

      .phone-shell {
        max-width: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .app {
        min-height: 100vh;
        border-radius: 0;
      }

      .game-grid {
        grid-template-columns: minmax(0, 1fr) 124px;
        gap: 14px;
        padding: 24px 22px 26px;
      }
    }
  </style>
</head>
<body>

  <div class="phone-shell">
    <div class="app">
      <header class="nav">
        <div class="nav-left">
          <button class="nav-button" type="button" data-action="back-device-list" aria-label="返回设备列表">
            <svg class="icon" viewBox="0 0 24 24"><use href="#i-back"></use></svg>
          </button>
          <div class="nav-title">Megg 1</div>
        </div>
        <button class="nav-button" type="button" data-action="open-settings" aria-label="设置">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-settings"></use></svg>
        </button>
      </header>

      <main class="content">
        <section class="device-zone">
          <svg class="device-product" viewBox="0 0 360 220" aria-hidden="true">
            <defs>
              <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"></stop>
                <stop offset="60%" stop-color="#f7f7f7"></stop>
                <stop offset="100%" stop-color="#e6e2e5"></stop>
              </linearGradient>
              <linearGradient id="deviceProbe" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"></stop>
                <stop offset="100%" stop-color="#e9e6e8"></stop>
              </linearGradient>
              <linearGradient id="deviceButton" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#9cc5d2"></stop>
                <stop offset="100%" stop-color="#7facb8"></stop>
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"></feDropShadow>
              </filter>
            </defs>

            <ellipse cx="182" cy="195" rx="88" ry="16" fill="rgba(0,0,0,0.06)"></ellipse>
            <g filter="url(#softShadow)" transform="translate(58 46) rotate(-8 125 65)">
              <path d="M95 25c38-10 115-8 154 18 18 12 28 28 29 47 1 22-8 39-28 51-23 14-57 18-118 17-47-1-79-8-98-24-18-15-23-34-16-56 8-24 34-44 77-53z" fill="url(#deviceBody)"></path>

              <path d="M38 115c2-9 7-15 15-18 14-5 31 4 41 18 5 7 7 16 5 23-3 9-12 16-22 17-15 2-34-8-40-23-3-5-3-11 1-17z" fill="url(#deviceProbe)"></path>
              <path d="M58 95c14 3 28 15 34 28" fill="none" stroke="rgba(188,180,184,0.26)" stroke-width="3.5" stroke-linecap="round"></path>
              <path d="M40 120c12 1 25 9 31 20" fill="none" stroke="rgba(188,180,184,0.24)" stroke-width="3.5" stroke-linecap="round"></path>
              <ellipse cx="183" cy="44" rx="26" ry="13" fill="url(#deviceButton)"></ellipse>
              <ellipse cx="183" cy="44" rx="10" ry="5" fill="rgba(93,96,103,0.42)"></ellipse>
              <circle cx="127" cy="72" r="2.2" fill="rgba(195,191,194,0.9)"></circle>
              <circle cx="136" cy="68" r="1.8" fill="rgba(210,206,209,0.85)"></circle>
              <circle cx="145" cy="64" r="1.4" fill="rgba(222,217,220,0.85)"></circle>
              <path d="M117 54h18" stroke="rgba(201,195,198,0.7)" stroke-width="2.8" stroke-linecap="round"></path>
            </g>
          </svg>

          <div class="device-status">
            <span class="status-item">
              <svg class="icon" viewBox="0 0 24 24"><use href="#i-bluetooth"></use></svg>
              <span>已连接</span>
            </span>
            <span class="status-divider"></span>
            <span class="status-item">
              <svg class="battery-icon" viewBox="0 0 24 24"><use href="#i-battery"></use></svg>
              <span>67%</span>
            </span>
          </div>
        </section>

        <section class="section">
          <div class="card plan-card">
            <div class="card-header">
              <div>
                <p class="eyebrow">今日训练计划</p>
                <h2 class="plan-title">3</h2>
              </div>
              <a class="text-button" href="./training-schedule-demo.html" data-action="open-all-schedules">全部日程</a>
            </div>

            <div class="plan-list">
              <button class="plan-item" type="button" data-action="open-plan-stim">
                <span class="icon-badge tone-blue">
                  <svg class="icon" viewBox="0 0 24 24"><use href="#i-stim"></use></svg>
                </span>
                <span class="plan-copy">
                  <strong>P01 电刺激治疗</strong>
                  <span>09:30 · 24 分钟</span>
                </span>
                <span class="plan-tail">
                  <svg class="chevron" viewBox="0 0 24 24"><use href="#i-chevron"></use></svg>
                </span>
              </button>

              <button class="plan-item" type="button" data-action="open-plan-ets">
                <span class="icon-badge tone-pink">
                  <svg class="icon" viewBox="0 0 24 24"><use href="#i-ets"></use></svg>
                </span>
                <span class="plan-copy">
                  <strong>P03 肌电触发电刺激</strong>
                  <span>14:00 · 18 分钟</span>
                </span>
                <span class="plan-tail">
                  <svg class="chevron" viewBox="0 0 24 24"><use href="#i-chevron"></use></svg>
                </span>
              </button>

              <button class="plan-item" type="button" data-action="open-plan-emg">
                <span class="icon-badge tone-rose">
                  <svg class="icon" viewBox="0 0 24 24"><use href="#i-emg"></use></svg>
                </span>
                <span class="plan-copy">
                  <strong>P05 肌电生物反馈治疗</strong>
                  <span>20:00 · 20 分钟</span>
                </span>
                <span class="plan-tail">
                  <svg class="chevron" viewBox="0 0 24 24"><use href="#i-chevron"></use></svg>
                </span>
              </button>
            </div>
          </div>
        </section>

        <section class="section">
          <p class="section-label">单次训练模式</p>
          <div class="mode-list">
            <button class="mode-item" type="button" data-action="open-stim-mode">
              <span class="icon-badge tone-blue">
                <svg class="icon" viewBox="0 0 24 24"><use href="#i-stim"></use></svg>
              </span>
              <span class="mode-copy">
                <strong>电刺激治疗</strong>
